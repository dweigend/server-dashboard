name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: docker build -t server-dashboard:check .
      - name: Check container liveness
        run: |
          docker run -d --name dashboard-check -p 127.0.0.1:3000:3000 -e ORIGIN=http://127.0.0.1:3000 server-dashboard:check
          trap 'docker logs dashboard-check; docker rm -f dashboard-check' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/health/live
